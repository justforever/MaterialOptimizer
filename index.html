<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>AI 裁切成本最佳化工具 - 鋸路修正版</title>
    <style>
        :root { --primary: #0369a1; --accent: #0891b2; --bg: #f8fafc; }
        body { font-family: system-ui, sans-serif; background: var(--bg); padding: 20px; color: #1e293b; }
        .container { max-width: 950px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .input-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .params-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; background: #f1f5f9; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        textarea, input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background: #0284c7; }
        
        .stat-card { background: white; padding: 15px; border: 1px solid #e2e8f0; border-radius: 10px; text-align: center; }
        .stat-value { font-size: 22px; font-weight: 800; color: var(--primary); }
        
        .bin-item { margin-top: 15px; border: 1px solid #e2e8f0; padding: 15px; border-radius: 10px; background: #fff; }
        .bin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .tag { padding: 3px 10px; border-radius: 12px; font-size: 11px; color: white; font-weight: bold; }
        
        .progress-bar { height: 35px; background: #f1f5f9; border-radius: 6px; overflow: hidden; display: flex; border: 1px solid #e2e8f0; }
        .segment { height: 100%; display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; border-right: 1px solid rgba(255,255,255,0.3); }
        .kerf { background: #334155 !important; width: 2px !important; flex-grow: 0 !important; flex-shrink: 0 !important; }
        .waste { background: #e2e8f0 !important; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; color:#0369a1;">⚙️ 智能裁切最佳化 (含鋸路損耗)</h2>
    
    <label>需求長度列表 (m):</label>
    <textarea id="demandsInput" rows="3" style="margin-bottom:20px;">1.1, 1.1, 1.1, 1.1, 1.43, 1.53, 1.7, 1.7, 1.7, 2.15, 2.3, 2.3, 2.3, 2.3, 2.45, 3.2, 3.3, 3.3, 3.6, 3.6, 3.8, 3.8, 3.802, 3.802, 4.08, 4.08, 4.22, 4.22, 4.22, 4.97, 5.18, 5.2, 5.3, 5.5, 5.62, 5.95, 6.05</textarea>

    <div class="input-section">
        <div>
            <label>🔵 定尺規格 & 單價 ($/m)</label>
            <input type="text" id="fixedStocks" value="10, 12">
            <input type="number" id="fixedPrice" value="100" style="margin-top:5px;">
        </div>
        <div>
            <label>💗 不定尺規格 & 單價 ($/m)</label>
            <input type="text" id="varStocks" value="9, 11, 13, 14">
            <input type="number" id="varPrice" value="150" style="margin-top:5px;">
        </div>
    </div>

    <div class="params-grid">
        <div>
            <label>📏 切割損耗 (鋸路) :</label>
            <input type="number" id="kerfInput" value="0.003" step="0.001">
            <small style="color:#64748b">單位：公尺 (3mm = 0.003)</small>
        </div>
        <div style="grid-column: span 2; display: flex; align-items: flex-end;">
            <p style="font-size: 0.85em; color: #475569; margin: 0;">※ 演算法會自動計算每次切割所需的間隙，確保現場材料足夠。</p>
        </div>
    </div>

    <button onclick="calculate()">開始計算最省錢方案</button>

    <div id="resultsArea" style="display:none; margin-top:30px;">
        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:15px; margin-bottom:20px;">
            <div class="stat-card">總支出<br><span class="stat-value" id="statCost">$0</span></div>
            <div class="stat-card">廢料/鋸屑總計<br><span class="stat-value" id="statWaste">0m</span></div>
            <div class="stat-card">使用支數<br><span class="stat-value" id="statCount">0</span></div>
        </div>
        <div id="binsList"></div>
    </div>
</div>

<script>
function calculate() {
    const demands = document.getElementById('demandsInput').value.split(/[,\s]+/).map(Number).filter(n => n > 0).sort((a,b) => b-a);
    const fixedSizes = document.getElementById('fixedStocks').value.split(/[,\s]+/).map(Number).filter(n => n > 0);
    const varSizes = document.getElementById('varStocks').value.split(/[,\s]+/).map(Number).filter(n => n > 0);
    const pFixed = parseFloat(document.getElementById('fixedPrice').value);
    const pVar = parseFloat(document.getElementById('varPrice').value);
    const kerf = parseFloat(document.getElementById('kerfInput').value);
    
    let remaining = [...demands];
    let results = [];
    let totalCost = 0;
    let totalWaste = 0;

    while (remaining.length > 0) {
        let bestOption = null;
        let minCostEfficiency = Infinity;

        const allSpecs = [
            ...fixedSizes.map(s => ({size: s, price: pFixed, isFixed: true})),
            ...varSizes.map(s => ({size: s, price: pVar, isFixed: false}))
        ];

        for (let spec of allSpecs) {
            if (spec.size < remaining[0]) continue;

            let currentSum = remaining[0];
            let indices = [0];
            let currentKerfCount = 0;

            for (let i = 1; i < remaining.length; i++) {
                // 檢查：目前總長 + 新需求 + 必須的一道鋸路 <= 原材規格
                if (currentSum + remaining[i] + kerf <= spec.size) {
                    currentSum += remaining[i] + kerf;
                    indices.push(i);
                    currentKerfCount++;
                }
            }
            
            let totalItemLength = indices.reduce((sum, idx) => sum + remaining[idx], 0);
            let efficiency = (spec.size * spec.price) / totalItemLength;

            if (efficiency < minCostEfficiency) {
                minCostEfficiency = efficiency;
                bestOption = { 
                    size: spec.size, 
                    indices, 
                    totalItemsLen: totalItemLength,
                    waste: spec.size - currentSum,
                    kerfCount: currentKerfCount,
                    isFixed: spec.isFixed,
                    cost: spec.size * spec.price
                };
            }
        }

        if (bestOption) {
            results.push({
                size: bestOption.size,
                items: bestOption.indices.map(i => remaining[i]),
                waste: bestOption.waste,
                kerfCount: bestOption.kerfCount,
                isFixed: bestOption.isFixed,
                cost: bestOption.cost
            });
            totalCost += bestOption.cost;
            totalWaste += (bestOption.waste + bestOption.kerfCount * kerf);
            bestOption.indices.sort((a,b) => b-a).forEach(i => remaining.splice(i, 1));
        } else {
            alert("長度 " + remaining[0] + " 超過最大規格限制"); break;
        }
    }

    render(results, totalCost, totalWaste, kerf);
}

function render(results, cost, waste, kerf) {
    document.getElementById('resultsArea').style.display = 'block';
    document.getElementById('statCost').innerText = "$" + cost.toLocaleString();
    document.getElementById('statWaste').innerText = waste.toFixed(3) + "m";
    document.getElementById('statCount').innerText = results.length + "支";

    const list = document.getElementById('binsList');
    list.innerHTML = '';
    const colors = ['#0284c7', '#0d9488', '#4f46e5', '#7c3aed', '#2563eb'];

    results.forEach((bin, idx) => {
        const div = document.createElement('div');
        div.className = 'bin-item';
        
        let barHtml = '';
        bin.items.forEach((it, i) => {
            barHtml += `<div class="segment" style="width:${(it/bin.size)*100}%; background:${colors[i%colors.length]}">${it}</div>`;
            if(i < bin.items.length - 1) {
                barHtml += `<div class="segment kerf" title="鋸路損耗 ${kerf}m"></div>`;
            }
        });
        if(bin.waste > 0) barHtml += `<div class="segment waste" style="width:${(bin.waste/bin.size)*100}%">${bin.waste.toFixed(2)}</div>`;

        div.innerHTML = `
            <div class="bin-header">
                <strong>#${idx+1} 規格 ${bin.size}m ($${bin.cost})</strong>
                <span class="tag ${bin.isFixed?'tag-fixed':'tag-var'}" style="background:${bin.isFixed?'#0369a1':'#db2777'}">
                    ${bin.isFixed?'定尺':'不定尺'}
                </span>
            </div>
            <div class="progress-bar">${barHtml}</div>
            <small style="color:#64748b">包含 ${bin.kerfCount} 處鋸路 (共 ${ (bin.kerfCount * kerf).toFixed(3) }m)</small>
        `;
        list.appendChild(div);
    });
}
</script>
</body>
</html>
