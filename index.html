<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>智能裁切最佳化系統</title>
    <style>
        :root { --primary: #0369a1; --accent: #0891b2; --bg: #f8fafc; --danger: #b91c1c; }
        body { font-family: system-ui, sans-serif; background: var(--bg); padding: 20px; color: #1e293b; }
        .container { max-width: 950px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }

        .cost-control {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding: 15px;
            background: #e0f2fe;
            border-radius: 8px;
            color: #0369a1;
            font-weight: bold;
        }
        #enableCost {
            width: 18px;
            height: 18px;
            cursor: pointer;
            flex-shrink: 0; /* 關鍵：防止被擠壓 */
            margin: 0;
        }
        .cost-label {
            cursor: pointer;
            line-height: 1.2;
            user-select: none;
        }

        .input-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .params-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; background: #f1f5f9; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        textarea, input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        .price-input:disabled { background: #e2e8f0; cursor: not-allowed; opacity: 0.6; }
        .hint { font-weight: normal; font-size: 0.8em; color: #64748b; margin-top: 4px; }

        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background: #0284c7; }
        button:disabled { background: #94a3b8; cursor: progress; }

        .messages { margin-top: 15px; }
        .message { padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; font-size: 0.9em; }
        .message.error { background: #fee2e2; color: var(--danger); border: 1px solid #fecaca; }
        .message.warn { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .message.info { background: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }

        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 15px; border: 1px solid #e2e8f0; border-radius: 10px; text-align: center; font-size: 0.9em; }
        .stat-value { font-size: 22px; font-weight: 800; color: var(--primary); display: block; margin-top: 6px; }

        .summary-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .summary-table th { background: var(--primary); color: white; padding: 12px; text-align: left; }
        .summary-table td { padding: 12px; border-bottom: 1px solid #e2e8f0; }

        .bin-item { margin-top: 15px; border: 1px solid #e2e8f0; padding: 15px; border-radius: 10px; background: #fff; }
        .bin-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .bin-meta { font-size: 0.85em; color: #64748b; margin-top: 8px; }
        .progress-bar { height: 35px; background: #f1f5f9; border-radius: 6px; overflow: hidden; display: flex; border: 1px solid #e2e8f0; margin-top: 10px; }
        .segment { height: 100%; display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; overflow: hidden; white-space: nowrap; }
        .segment.kerf { background: #334155; flex: 0 0 2px; min-width: 2px; }
        .segment.waste { background: repeating-linear-gradient(45deg, #e2e8f0, #e2e8f0 6px, #cbd5e1 6px, #cbd5e1 12px); color: #475569; }
        .tag { padding: 3px 10px; border-radius: 12px; font-size: 11px; color: white; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; color:#0369a1;">📊 智能裁切最佳化系統</h2>

    <label for="demandsInput">需求長度列表 (m):</label>
    <textarea id="demandsInput" rows="3" style="margin-bottom:20px;">1.1, 1.1, 1.1, 1.1, 1.43, 1.53, 1.7, 1.7, 1.7, 2.15, 2.3, 2.3, 2.3, 2.3, 2.45, 3.2, 3.3, 3.3, 3.6, 3.6, 3.8, 3.8, 3.802, 3.802, 4.08, 4.08, 4.22, 4.22, 4.22, 4.97, 5.18, 5.2, 5.3, 5.5, 5.62, 5.95, 6.05</textarea>

    <div class="cost-control">
        <input type="checkbox" id="enableCost" onchange="toggleCostInputs()">
        <label for="enableCost" class="cost-label">啟用單價權重計算 (勾選後優先尋找最便宜方案，否則以最省料為準)</label>
    </div>

    <div class="input-section">
        <div>
            <label for="fixedStocks">🔵 定尺規格</label>
            <input type="text" id="fixedStocks" value="10, 12">
            <div style="margin-top:10px;">
                <label for="fixedPrice">每米單價 ($):</label>
                <input type="number" id="fixedPrice" value="100" min="0" step="any" class="price-input" disabled>
            </div>
        </div>
        <div>
            <label for="varStocks">💗 不定尺規格</label>
            <input type="text" id="varStocks" value="9, 11, 13, 14">
            <div style="margin-top:10px;">
                <label for="varPrice">每米單價 ($):</label>
                <input type="number" id="varPrice" value="150" min="0" step="any" class="price-input" disabled>
            </div>
        </div>
    </div>

    <div class="params-grid">
        <div>
            <label for="kerfInput">📏 鋸路 (切割損耗, m):</label>
            <input type="number" id="kerfInput" value="0.003" min="0" step="0.001">
            <div class="hint">每兩件之間扣一道鋸路；留白視為 0。</div>
        </div>
    </div>

    <button id="runBtn" onclick="calculate()">執行最佳化運算</button>

    <div id="messages" class="messages"></div>

    <div id="resultsArea" style="display:none; margin-top:30px;">
        <div class="stat-grid">
            <div class="stat-card">預估總成本<span class="stat-value" id="statCost">N/A</span></div>
            <div class="stat-card">材料利用率<span class="stat-value" id="statUtil">0%</span></div>
            <div class="stat-card">總廢料長度<span class="stat-value" id="statWaste">0 m</span></div>
            <div class="stat-card">總支數<span class="stat-value" id="statCount">0</span></div>
        </div>

        <div id="binsList"></div>

        <h3 style="margin-top:40px; border-left: 5px solid var(--primary); padding-left: 10px;">📋 採購清單統計</h3>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>材料規格</th>
                    <th>類別</th>
                    <th>需要支數</th>
                </tr>
            </thead>
            <tbody id="summaryBody"></tbody>
        </table>
    </div>
</div>

<script src="solver.js"></script>
<script src="app.js"></script>
</body>
</html>
