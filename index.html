<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>智能裁切最佳化系統</title>
    <style>
        :root { --primary: #0369a1; --accent: #0891b2; --bg: #f8fafc; --danger: #b91c1c; }
        body { font-family: system-ui, sans-serif; background: var(--bg); padding: 20px; color: #1e293b; }
        .container { max-width: 950px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }

        .cost-control {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding: 15px;
            background: #e0f2fe;
            border-radius: 8px;
            color: #0369a1;
            font-weight: bold;
        }
        #enableCost {
            width: 18px;
            height: 18px;
            cursor: pointer;
            flex-shrink: 0; /* 關鍵：防止被擠壓 */
            margin: 0;
        }
        .cost-label {
            cursor: pointer;
            line-height: 1.2;
            user-select: none;
        }

        .input-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .params-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; background: #f1f5f9; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        textarea, input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        .price-input:disabled { background: #e2e8f0; cursor: not-allowed; opacity: 0.6; }
        .hint { font-weight: normal; font-size: 0.8em; color: #64748b; margin-top: 4px; }

        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background: #0284c7; }
        button:disabled { background: #94a3b8; cursor: progress; }

        .messages { margin-top: 15px; }
        .message { padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; font-size: 0.9em; }
        .message.error { background: #fee2e2; color: var(--danger); border: 1px solid #fecaca; }
        .message.warn { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .message.info { background: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }

        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 15px; border: 1px solid #e2e8f0; border-radius: 10px; text-align: center; font-size: 0.9em; }
        .stat-value { font-size: 22px; font-weight: 800; color: var(--primary); display: block; margin-top: 6px; }

        .summary-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .summary-table th { background: var(--primary); color: white; padding: 12px; text-align: left; }
        .summary-table td { padding: 12px; border-bottom: 1px solid #e2e8f0; }

        .bin-item { margin-top: 15px; border: 1px solid #e2e8f0; padding: 15px; border-radius: 10px; background: #fff; }
        .bin-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .bin-meta { font-size: 0.85em; color: #64748b; margin-top: 8px; }
        .progress-bar { height: 35px; background: #f1f5f9; border-radius: 6px; overflow: hidden; display: flex; border: 1px solid #e2e8f0; margin-top: 10px; }
        .segment { height: 100%; display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; overflow: hidden; white-space: nowrap; }
        .segment.kerf { background: #334155; flex: 0 0 2px; min-width: 2px; }
        .segment.waste { background: repeating-linear-gradient(45deg, #e2e8f0, #e2e8f0 6px, #cbd5e1 6px, #cbd5e1 12px); color: #475569; }
        .tag { padding: 3px 10px; border-radius: 12px; font-size: 11px; color: white; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; color:#0369a1;">📊 智能裁切最佳化系統</h2>

    <label for="demandsInput">需求長度列表 (m):</label>
    <textarea id="demandsInput" rows="3" style="margin-bottom:20px;">1.1, 1.1, 1.1, 1.1, 1.43, 1.53, 1.7, 1.7, 1.7, 2.15, 2.3, 2.3, 2.3, 2.3, 2.45, 3.2, 3.3, 3.3, 3.6, 3.6, 3.8, 3.8, 3.802, 3.802, 4.08, 4.08, 4.22, 4.22, 4.22, 4.97, 5.18, 5.2, 5.3, 5.5, 5.62, 5.95, 6.05</textarea>

    <div class="cost-control">
        <input type="checkbox" id="enableCost" onchange="toggleCostInputs()">
        <label for="enableCost" class="cost-label">啟用單價權重計算 (勾選後優先尋找最便宜方案，否則以最省料為準)</label>
    </div>

    <div class="input-section">
        <div>
            <label for="fixedStocks">🔵 定尺規格</label>
            <input type="text" id="fixedStocks" value="10, 12">
            <div style="margin-top:10px;">
                <label for="fixedPrice">每米單價 ($):</label>
                <input type="number" id="fixedPrice" value="100" min="0" step="any" class="price-input" disabled>
            </div>
        </div>
        <div>
            <label for="varStocks">💗 不定尺規格</label>
            <input type="text" id="varStocks" value="9, 11, 13, 14">
            <div style="margin-top:10px;">
                <label for="varPrice">每米單價 ($):</label>
                <input type="number" id="varPrice" value="150" min="0" step="any" class="price-input" disabled>
            </div>
        </div>
    </div>

    <div class="params-grid">
        <div>
            <label for="kerfInput">📏 鋸路 (切割損耗, m):</label>
            <input type="number" id="kerfInput" value="0.003" min="0" step="0.001">
            <div class="hint">每兩件之間扣一道鋸路；留白視為 0。</div>
        </div>
    </div>

    <button id="runBtn" onclick="calculate()">執行最佳化運算</button>

    <div id="messages" class="messages"></div>

    <div id="resultsArea" style="display:none; margin-top:30px;">
        <div class="stat-grid">
            <div class="stat-card">預估總成本<span class="stat-value" id="statCost">N/A</span></div>
            <div class="stat-card">材料利用率<span class="stat-value" id="statUtil">0%</span></div>
            <div class="stat-card">總廢料長度<span class="stat-value" id="statWaste">0 m</span></div>
            <div class="stat-card">總支數<span class="stat-value" id="statCount">0</span></div>
        </div>

        <div id="binsList"></div>

        <h3 style="margin-top:40px; border-left: 5px solid var(--primary); padding-left: 10px;">📋 採購清單統計</h3>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>材料規格</th>
                    <th>類別</th>
                    <th>需要支數</th>
                </tr>
            </thead>
            <tbody id="summaryBody"></tbody>
        </table>
    </div>
</div>

<script>
/* ============================================================
   Cutting-stock solver
   ------------------------------------------------------------
   所有長度在內部一律換算成整數「公釐」(×1000) 再運算，
   避免 3.802 + 0.003 這類浮點誤差造成「明明放得下卻判定放不下」。

   三段式策略：
     1. 件數 <= EXACT_THRESHOLD：列舉所有「極大裁切樣式」(maximal
        pattern) 做記憶化搜尋，回傳真正的最小成本解。
     2. 件數較多：貪婪法（每支料用 0/1 背包取最佳填充）先求初始解。
     3. 再跑成對重組的區域搜尋，把貪婪法短視造成的錯誤修掉。

   目標函數：總成本（未啟用單價時 price 一律為 1，等同最小化總用料
   長度，也就等同最小化廢料）；成本相同時取支數較少者。
   ============================================================ */
var CuttingStock = (function () {
  'use strict';

  var SCALE = 1000;                // 1 單位 = 1/1000 m
  var EXACT_THRESHOLD = 16;        // 件數 <= 此值走精確解
  var EXACT_NODE_BUDGET = 200000;  // 精確解的搜尋節點上限，超過則退回啟發式
  var PATTERN_LIMIT = 20000;       // 單一狀態下列舉的裁切樣式上限
  var REPACK_MAX_ITEMS = 20;       // 成對重組時的件數上限（2^n 列舉）
  var LOCAL_SEARCH_MS = 2000;      // 區域搜尋時間預算

  function toInt(v) { return Math.round(v * SCALE); }
  function toFloat(v) { return v / SCALE; }

  /** 把可能是空字串 / NaN / 負數的輸入收斂成合理數值 */
  function safeNum(raw, fallback, min) {
    var n = typeof raw === 'number' ? raw : parseFloat(raw);
    if (!isFinite(n)) return fallback;
    if (typeof min === 'number' && n < min) return fallback;
    return n;
  }

  // ---- 0/1 背包：在 capacity 內取得最大填充長度，且必定包含 items[0] ----
  // items 需為 {value, idx} 且已由大到小排序，回傳 idx 陣列。
  function bestFill(items, capacity, kerf) {
    var base = items[0].value;
    if (base > capacity) return null;
    var capLeft = capacity - base;
    var rest = items.slice(1);
    var n = rest.length;
    var width = capLeft + 1;

    var dp = new Int32Array(width);
    var take = new Uint8Array(n * width);   // take[i*width + c]=1 → 容量 c 時選了第 i 件

    for (var i = 0; i < n; i++) {
      var w = rest[i].value + kerf;         // 每多放一件就多一道鋸路
      if (w > capLeft) continue;
      var row = i * width;
      for (var c = capLeft; c >= w; c--) {
        var cand = dp[c - w] + w;
        if (cand > dp[c]) { dp[c] = cand; take[row + c] = 1; }
      }
    }

    var used = [items[0].idx];
    var pos = capLeft;
    for (var j = n - 1; j >= 0; j--) {
      if (take[j * width + pos]) {
        used.push(rest[j].idx);
        pos -= rest[j].value + kerf;
      }
    }
    return used;
  }

  // ---- 列舉「極大裁切樣式」----
  // 必含最大件 rem[0]（對稱性剪枝：最大件一定落在某支料，先處理它）。
  // 只保留「再也塞不下任何一件」的樣式：若 P 放得下且 P∪{x} 也放得下，
  // 改用 P∪{x} 絕不會比較差，所以非極大的樣式可以直接捨棄。
  function maximalPatterns(rem, capacity, kerf) {
    var n = rem.length;
    var out = [];
    var chosen = [0];
    var overflow = false;

    function dfs(i, used, smallestExcluded) {
      if (out.length >= PATTERN_LIMIT) { overflow = true; return; }
      if (i === n) {
        // 極大性檢查：rem 由大到小，最小的未選件也塞不下才算數
        if (smallestExcluded === -1 || used + rem[smallestExcluded] + kerf > capacity) {
          out.push(chosen.slice());
        }
        return;
      }
      var w = rem[i] + kerf;
      // 等值重複件只允許「由前往後連續選取」：前一件同值卻沒選，就不准選這件。
      // 否則 [3,3,3] 會列舉出 {第1件} 與 {第2件} 這種內容完全相同的重複樣式。
      var prevSameValueSkipped = i > 0 && rem[i] === rem[i - 1] &&
        !(chosen.length > 0 && chosen[chosen.length - 1] === i - 1);
      if (!prevSameValueSkipped && used + w <= capacity) {
        chosen.push(i);
        dfs(i + 1, used + w, smallestExcluded);
        chosen.pop();
      }
      dfs(i + 1, used, i);
    }

    dfs(1, rem[0], -1);
    if (out.length === 0 && overflow) return null;
    return out;
  }

  function BudgetExceeded() {}

  function makeBin(spec, itemValues) {
    return { size: spec.size, isFixed: spec.isFixed, cost: spec.cost, items: itemValues };
  }

  // ---- 精確解：記憶化搜尋所有極大樣式的組合 ----
  function exactSolve(items, specs, kerf) {
    var memo = new Map();
    var nodes = 0;

    function solveRec(rem) {
      if (rem.length === 0) return { cost: 0, count: 0, bins: [] };
      var k = rem.join(',');
      var hit = memo.get(k);
      if (hit) return hit;
      if (++nodes > EXACT_NODE_BUDGET) throw new BudgetExceeded();

      var best = null;
      for (var s = 0; s < specs.length; s++) {
        var spec = specs[s];
        if (spec.size < rem[0]) continue;
        // 剪枝：這支料本身就已經比目前最佳的「整體」成本貴，不可能更好
        if (best && spec.cost > best.cost) continue;

        var patterns = maximalPatterns(rem, spec.size, kerf);
        if (!patterns) throw new BudgetExceeded();

        for (var p = 0; p < patterns.length; p++) {
          var idxs = patterns[p];
          var usedSet = new Set(idxs);
          var next = [];
          for (var i = 0; i < rem.length; i++) if (!usedSet.has(i)) next.push(rem[i]);

          var sub = solveRec(next);
          if (sub.cost === Infinity) continue;
          var cost = spec.cost + sub.cost;
          var count = 1 + sub.count;
          if (!best || cost < best.cost || (cost === best.cost && count < best.count)) {
            best = {
              cost: cost,
              count: count,
              bins: [makeBin(spec, idxs.map(function (i) { return rem[i]; }))].concat(sub.bins)
            };
          }
        }
      }
      if (!best) best = { cost: Infinity, count: 0, bins: [] };
      memo.set(k, best);
      return best;
    }

    return solveRec(items.slice().sort(function (a, b) { return b - a; }));
  }

  // ---- 貪婪法：每次挑一支「最划算」的料，用背包取最佳填充 ----
  function greedySolve(items, specs, kerf, isCostEnabled) {
    var rem = items.slice().sort(function (a, b) { return b - a; });
    var bins = [];
    while (rem.length > 0) {
      var objs = rem.map(function (v, idx) { return { value: v, idx: idx }; });
      var bestOption = null, minScore = Infinity;
      for (var s = 0; s < specs.length; s++) {
        var spec = specs[s];
        if (spec.size < rem[0]) continue;
        var idxs = bestFill(objs, spec.size, kerf);
        if (!idxs) continue;
        var filled = 0;
        for (var i = 0; i < idxs.length; i++) filled += rem[idxs[i]];
        // 有成本：每公尺實裝的花費；無成本：純廢料長度
        var score = isCostEnabled ? spec.cost / filled : spec.size - filled;
        if (score < minScore) { minScore = score; bestOption = { spec: spec, idxs: idxs }; }
      }
      if (!bestOption) break;   // 連最大規格都放不下 rem[0]
      bins.push(makeBin(bestOption.spec, bestOption.idxs.map(function (i) { return rem[i]; })));
      bestOption.idxs.slice().sort(function (a, b) { return b - a; })
        .forEach(function (i) { rem.splice(i, 1); });
    }
    return bins;
  }

  // ---- 成對重組的區域搜尋 ----
  function fitsInSpec(values, spec, kerf) {
    var sum = 0;
    for (var i = 0; i < values.length; i++) sum += values[i];
    return sum + Math.max(0, values.length - 1) * kerf <= spec.size;
  }

  function cheapestSpecFor(values, specs, kerf) {
    if (values.length === 0) return null;
    var best = null;
    for (var i = 0; i < specs.length; i++) {
      if (fitsInSpec(values, specs[i], kerf) && (!best || specs[i].cost < best.cost)) best = specs[i];
    }
    return best;
  }

  function bestRepack(values, specs, kerf) {
    var n = values.length;
    if (n > REPACK_MAX_ITEMS) return null;
    var best = null;
    var total = 1 << n;
    // 固定第 0 件在 A 組，避開 A/B 互換的鏡像組合（列舉量直接減半）
    for (var mask = 1; mask < total; mask += 2) {
      var A = [], B = [];
      for (var i = 0; i < n; i++) { if ((mask >> i) & 1) A.push(values[i]); else B.push(values[i]); }
      var specA = cheapestSpecFor(A, specs, kerf);
      if (!specA) continue;
      var cost = specA.cost;
      if (best && cost >= best.cost) continue;
      var bins = [makeBin(specA, A)];
      if (B.length > 0) {
        var specB = cheapestSpecFor(B, specs, kerf);
        if (!specB) continue;
        cost += specB.cost;
        bins.push(makeBin(specB, B));
      }
      if (!best || cost < best.cost || (cost === best.cost && bins.length < best.bins.length)) {
        best = { cost: cost, bins: bins };
      }
    }
    return best;
  }

  function localSearchImprove(bins, specs, kerf, deadline) {
    var improved = true;
    while (improved) {
      improved = false;
      for (var i = 0; i < bins.length && !improved; i++) {
        for (var j = i + 1; j < bins.length && !improved; j++) {
          if (Date.now() > deadline) return bins;   // 時間預算，避免凍結瀏覽器
          var combined = bins[i].items.concat(bins[j].items);
          if (combined.length > REPACK_MAX_ITEMS) continue;
          var currentCost = bins[i].cost + bins[j].cost;
          var cand = bestRepack(combined, specs, kerf);
          if (!cand) continue;
          if (cand.cost < currentCost || (cand.cost === currentCost && cand.bins.length < 2)) {
            var next = bins.slice();
            next.splice(j, 1);
            next.splice.apply(next, [i, 1].concat(cand.bins));
            bins = next;
            improved = true;
          }
        }
      }
    }
    return bins;
  }

  /**
   * @param {number[]} demands 需求長度 (m)
   * @param {{size:number, price:number, isFixed:boolean}[]} specs 原材規格
   * @param {number} kerf 鋸路 (m)
   * @param {boolean} isCostEnabled 是否以成本為目標（否則以最省料為目標）
   * @returns {{bins:Array, unfittable:number[], exact:boolean}}
   */
  function solve(demands, specs, kerf, isCostEnabled) {
    var kerfInt = toInt(safeNum(kerf, 0, 0));
    var specsInt = specs
      .filter(function (s) { return safeNum(s.size, 0, 0) > 0; })
      .map(function (s) {
        var size = toInt(s.size);
        var price = isCostEnabled ? safeNum(s.price, 1, 0) : 1;
        return { size: size, price: price, isFixed: !!s.isFixed, cost: size * price };
      });

    if (specsInt.length === 0 || demands.length === 0) {
      return { bins: [], unfittable: demands.slice(), exact: true };
    }

    var maxSize = specsInt.reduce(function (m, s) { return Math.max(m, s.size); }, 0);
    var items = [], unfittable = [];
    demands.forEach(function (d) {
      var v = toInt(d);
      if (v <= 0) return;
      if (v > maxSize) unfittable.push(d); else items.push(v);
    });

    if (items.length === 0) return { bins: [], unfittable: unfittable, exact: true };

    var bins = null, exact = false;
    if (items.length <= EXACT_THRESHOLD) {
      try {
        var r = exactSolve(items, specsInt, kerfInt);
        // Infinity 代表搜不到可行解（理論上不該發生，超長件已先濾掉）
        if (r.cost !== Infinity) { bins = r.bins; exact = true; }
      } catch (e) {
        if (!(e instanceof BudgetExceeded)) throw e;
        bins = null;   // 預算用盡，退回啟發式
      }
    }
    if (!bins) {
      bins = greedySolve(items, specsInt, kerfInt, isCostEnabled);
      bins = localSearchImprove(bins, specsInt, kerfInt, Date.now() + LOCAL_SEARCH_MS);
    }

    var packed = bins.reduce(function (n, b) { return n + b.items.length; }, 0);
    if (packed < items.length) {
      // 理論上不會發生；真的發生就明確回報而不是默默吞掉需求
      throw new Error('內部錯誤：有 ' + (items.length - packed) + ' 件需求未被排入任何原材');
    }

    var out = bins.map(function (b) {
      var used = b.items.reduce(function (a, c) { return a + c; }, 0);
      var kerfTotal = Math.max(0, b.items.length - 1) * kerfInt;
      return {
        size: toFloat(b.size),
        isFixed: b.isFixed,
        cost: b.cost / SCALE,
        items: b.items.map(toFloat),
        kerfTotal: toFloat(kerfTotal),
        waste: toFloat(b.size - used - kerfTotal)
      };
    });
    return { bins: out, unfittable: unfittable, exact: exact };
  }

  return {
    solve: solve,
    safeNum: safeNum,
    _internal: { exactSolve: exactSolve, greedySolve: greedySolve, localSearchImprove: localSearchImprove, bestFill: bestFill, toInt: toInt }
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = CuttingStock;
</script>

<script>
/* ---------------- UI ---------------- */
function toggleCostInputs() {
    var isEnabled = document.getElementById('enableCost').checked;
    document.querySelectorAll('.price-input').forEach(function (input) {
        input.disabled = !isEnabled;
    });
}

/** 解析數字列表，同時回報無法辨識的字詞 */
function parseNumberList(raw) {
    var values = [], invalid = [];
    raw.split(/[,，\s]+/).forEach(function (token) {
        if (!token) return;
        var n = Number(token);
        if (!isFinite(n) || n <= 0) invalid.push(token); else values.push(n);
    });
    return { values: values, invalid: invalid };
}

function showMessages(list) {
    var box = document.getElementById('messages');
    box.innerHTML = '';
    list.forEach(function (m) {
        var div = document.createElement('div');
        div.className = 'message ' + m.type;
        div.textContent = m.text;   // textContent：不讓使用者輸入變成 HTML
        box.appendChild(div);
    });
}

function calculate() {
    var btn = document.getElementById('runBtn');
    var messages = [];

    var demandsIn = parseNumberList(document.getElementById('demandsInput').value);
    var fixedIn = parseNumberList(document.getElementById('fixedStocks').value);
    var varIn = parseNumberList(document.getElementById('varStocks').value);

    [['需求長度', demandsIn], ['定尺規格', fixedIn], ['不定尺規格', varIn]].forEach(function (pair) {
        if (pair[1].invalid.length) {
            messages.push({ type: 'warn', text: pair[0] + '中有無法辨識或非正數的項目已被忽略：' + pair[1].invalid.join(', ') });
        }
    });

    if (demandsIn.values.length === 0) {
        messages.push({ type: 'error', text: '請至少輸入一個有效的需求長度。' });
    }
    if (fixedIn.values.length === 0 && varIn.values.length === 0) {
        messages.push({ type: 'error', text: '請至少輸入一種原材規格。' });
    }
    if (messages.some(function (m) { return m.type === 'error'; })) {
        showMessages(messages);
        document.getElementById('resultsArea').style.display = 'none';
        return;
    }

    var isCostEnabled = document.getElementById('enableCost').checked;
    var pFixed = CuttingStock.safeNum(document.getElementById('fixedPrice').value, 1, 0);
    var pVar = CuttingStock.safeNum(document.getElementById('varPrice').value, 1, 0);
    var kerfRaw = document.getElementById('kerfInput').value;
    var kerf = CuttingStock.safeNum(kerfRaw, 0, 0);
    if (String(kerfRaw).trim() !== '' && kerf !== Number(kerfRaw)) {
        messages.push({ type: 'warn', text: '鋸路輸入無效，已以 0 計算。' });
    }

    var allSpecs = fixedIn.values.map(function (s) { return { size: s, price: pFixed, isFixed: true }; })
        .concat(varIn.values.map(function (s) { return { size: s, price: pVar, isFixed: false }; }));

    btn.disabled = true;
    btn.textContent = '運算中…';
    // 讓瀏覽器先把 disabled 狀態畫出來，再進行同步運算
    setTimeout(function () {
        try {
            var result = CuttingStock.solve(demandsIn.values, allSpecs, kerf, isCostEnabled);

            if (result.unfittable.length) {
                messages.push({
                    type: 'error',
                    text: '以下長度超過最大規格，無法裁切（其餘需求仍已排程）：' + result.unfittable.join(', ')
                });
            }
            messages.push({
                type: 'info',
                text: result.exact
                    ? '已取得最佳解（窮舉所有裁切組合）。'
                    : '需求件數較多，採用啟發式演算法求近似最佳解。'
            });
            showMessages(messages);

            if (result.bins.length === 0) {
                document.getElementById('resultsArea').style.display = 'none';
                return;
            }
            render(result, isCostEnabled, kerf);
        } catch (err) {
            showMessages(messages.concat([{ type: 'error', text: '運算失敗：' + err.message }]));
            document.getElementById('resultsArea').style.display = 'none';
        } finally {
            btn.disabled = false;
            btn.textContent = '執行最佳化運算';
        }
    }, 0);
}

function fmt(n, digits) {
    return Number(n.toFixed(digits === undefined ? 3 : digits));
}

function render(result, isCostEnabled, kerf) {
    var bins = result.bins;
    document.getElementById('resultsArea').style.display = 'block';

    var totalCost = bins.reduce(function (a, b) { return a + b.cost; }, 0);
    var totalStockLen = bins.reduce(function (a, b) { return a + b.size; }, 0);
    var totalDemandLen = bins.reduce(function (a, b) {
        return a + b.items.reduce(function (x, y) { return x + y; }, 0);
    }, 0);
    var totalWaste = bins.reduce(function (a, b) { return a + b.waste; }, 0);

    document.getElementById('statCost').textContent = isCostEnabled
        ? '$' + totalCost.toLocaleString(undefined, { maximumFractionDigits: 2 })
        : 'N/A';
    document.getElementById('statUtil').textContent = totalStockLen > 0
        ? (totalDemandLen / totalStockLen * 100).toFixed(1) + '%'
        : '—';
    document.getElementById('statWaste').textContent = fmt(totalWaste) + ' m';
    document.getElementById('statCount').textContent = bins.length + ' 支';

    var list = document.getElementById('binsList');
    list.innerHTML = '';
    var colors = ['#0284c7', '#0d9488', '#4f46e5', '#7c3aed', '#2563eb'];

    bins.forEach(function (bin, idx) {
        var div = document.createElement('div');
        div.className = 'bin-item';

        var head = document.createElement('div');
        head.className = 'bin-head';
        var title = document.createElement('strong');
        title.textContent = '#' + (idx + 1) + ' 規格 ' + fmt(bin.size) + 'm';
        var tag = document.createElement('span');
        tag.className = 'tag';
        tag.style.background = bin.isFixed ? '#0369a1' : '#db2777';
        tag.textContent = bin.isFixed ? '定尺' : '不定尺';
        head.appendChild(title);
        head.appendChild(tag);
        div.appendChild(head);

        var bar = document.createElement('div');
        bar.className = 'progress-bar';
        bin.items.forEach(function (it, i) {
            if (i > 0) {
                var k = document.createElement('div');
                k.className = 'segment kerf';
                k.title = '鋸路 ' + fmt(kerf) + 'm';
                bar.appendChild(k);
            }
            var seg = document.createElement('div');
            seg.className = 'segment';
            seg.style.flex = '0 0 ' + (it / bin.size * 100) + '%';
            seg.style.background = colors[i % colors.length];
            seg.textContent = fmt(it);
            seg.title = fmt(it) + 'm';
            bar.appendChild(seg);
        });
        if (bin.waste > 0) {
            var w = document.createElement('div');
            w.className = 'segment waste';
            w.style.flex = '1 1 auto';
            w.textContent = fmt(bin.waste) + 'm';
            w.title = '剩餘 ' + fmt(bin.waste) + 'm';
            bar.appendChild(w);
        }
        div.appendChild(bar);

        var meta = document.createElement('div');
        meta.className = 'bin-meta';
        meta.textContent = bin.items.length + ' 件　鋸路合計 ' + fmt(bin.kerfTotal) +
            'm　剩餘 ' + fmt(bin.waste) + 'm' + (isCostEnabled ? '　成本 $' + fmt(bin.cost, 2) : '');
        div.appendChild(meta);

        list.appendChild(div);
    });

    var stats = {};
    bins.forEach(function (bin) {
        var key = fmt(bin.size) + 'm|' + (bin.isFixed ? '定尺' : '不定尺');
        stats[key] = (stats[key] || 0) + 1;
    });

    var summaryBody = document.getElementById('summaryBody');
    summaryBody.innerHTML = '';
    Object.keys(stats).sort(function (a, b) { return parseFloat(a) - parseFloat(b); }).forEach(function (key) {
        var row = summaryBody.insertRow();
        var parts = key.split('|');
        row.insertCell(0).textContent = parts[0];
        row.insertCell(1).textContent = parts[1];
        var cell = row.insertCell(2);
        var strong = document.createElement('strong');
        strong.textContent = stats[key];
        cell.appendChild(strong);
    });
}
</script>
